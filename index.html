<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ניהול תיקים</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header>
      <div class="header-title">
        <span class="icon">⚖️</span>
        <h1>ניהול תיקים</h1>
      </div>
      <button id="btn-add" onclick="openModal()">+ הוסף תיק</button>
    </header>

    <div class="summary-bar">
      <div class="summary-card urgent">
        <span id="count-urgent">0</span>
        <label>באיחור</label>
      </div>
      <div class="summary-card soon">
        <span id="count-soon">0</span>
        <label>השבוע</label>
      </div>
      <div class="summary-card ok">
        <span id="count-ok">0</span>
        <label>תקין</label>
      </div>
      <div class="summary-card total">
        <span id="count-total">0</span>
        <label>סה"כ תיקים</label>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>שם התיק</th>
            <th>פעולה הבאה</th>
            <th>מועד ביצוע</th>
            <th>ימים נותרים</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="cases-table-body">
        </tbody>
      </table>
      <div id="empty-state" class="empty-state">
        <p>אין תיקים עדיין. לחצי על "הוסף תיק" כדי להתחיל.</p>
      </div>
    </div>

  </div>

  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <h2 id="modal-title">הוספת תיק חדש</h2>

      <label>שם התיק</label>
      <input type="text" id="input-name" placeholder="לדוגמה: כהן נ' לוי" />

      <label>פעולה הבאה</label>
      <input type="text" id="input-action" placeholder="לדוגמה: הגשת כתב הגנה" />

      <label>מועד ביצוע</label>
      <input type="date" id="input-date" />

      <div class="modal-buttons">
        <button onclick="saveCase()">שמור</button>
        <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
