<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול תיקים</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6fb;
    color: #1e2a3a;
    min-height: 100vh;
    direction: rtl;
  }

  .top-bar {
    background: linear-gradient(135deg, #1e2a3a 0%, #2d4263 100%);
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }

  .top-bar h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .top-bar h1 span { font-size: 24px; }

  .btn-add {
    background: #c9a84c;
    color: #1e2a3a;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, transform 0.1s;
    letter-spacing: 0.2px;
  }
  .btn-add:hover { background: #e0bc66; transform: translateY(-1px); }
  .btn-add:active { transform: translateY(0); }

  .summary-row {
    display: flex;
    gap: 16px;
    padding: 24px 40px 0;
    max-width: 1000px;
    margin: 0 auto;
  }

  .card {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    border-top: 4px solid transparent;
  }
  .card .num { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .card .lbl { font-size: 12px; color: #888; margin-top: 4px; }

  .card.red    { border-top-color: #e53e3e; }
  .card.red    .num { color: #e53e3e; }
  .card.orange { border-top-color: #d97706; }
  .card.orange .num { color: #d97706; }
  .card.green  { border-top-color: #059669; }
  .card.green  .num { color: #059669; }
  .card.blue   { border-top-color: #3b82f6; }
  .card.blue   .num { color: #3b82f6; }

  .table-section {
    max-width: 1000px;
    margin: 24px auto 40px;
    padding: 0 40px;
  }

  .table-wrap {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  thead tr { background: #1e2a3a; }
  thead th {
    color: #c9a84c;
    padding: 15px 22px;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.6px;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid #eef0f4; transition: background 0.12s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f7f9ff; }
  tbody td { padding: 16px 22px; font-size: 14px; vertical-align: middle; }

  .case-name { font-weight: 700; color: #1e2a3a; font-size: 15px; }
  .action-text { color: #374151; }
  .date-text { color: #6b7280; font-size: 13px; white-space: nowrap; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge.overdue { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .badge.soon    { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
  .badge.ok      { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }

  .row-actions { display: flex; gap: 8px; }
  .btn-edit, .btn-del {
    border: none; border-radius: 6px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-edit:hover, .btn-del:hover { opacity: 0.75; }
  .btn-edit { background: #eff6ff; color: #1d4ed8; }
  .btn-del  { background: #fef2f2; color: #dc2626; }

  .empty { text-align: center; padding: 56px 20px; color: #9ca3af; }
  .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,20,40,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }

  .modal {
    background: #fff; border-radius: 16px; padding: 36px 32px 28px;
    width: 460px; max-width: 95vw;
    box-shadow: 0 12px 48px rgba(0,0,0,0.22);
    animation: slideUp 0.18s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .modal-header h2 { font-size: 20px; color: #1e2a3a; font-weight: 700; }
  .btn-close { background: none; border: none; font-size: 20px; color: #9ca3af; cursor: pointer; line-height: 1; }
  .btn-close:hover { color: #374151; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 6px; letter-spacing: 0.4px; }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid #e5e7eb; border-radius: 9px;
    font-size: 14px; font-family: inherit; direction: rtl;
    outline: none; transition: border 0.15s, box-shadow 0.15s; color: #1e2a3a;
  }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .btn-save {
    background: #1e2a3a; color: #c9a84c; border: none;
    padding: 11px 28px; border-radius: 9px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-save:hover { background: #2d4263; }
  .btn-cancel {
    background: #f3f4f6; color: #374151; border: none;
    padding: 11px 20px; border-radius: 9px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .btn-cancel:hover { background: #e5e7eb; }

  @media (max-width: 640px) {
    .top-bar, .summary-row, .table-section { padding-right: 16px; padding-left: 16px; }
    .summary-row { flex-wrap: wrap; }
    .card { min-width: calc(50% - 8px); }
    thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1><span>⚖️</span> ניהול תיקים</h1>
  <button class="btn-add" onclick="openModal()">+ הוסף תיק</button>
</div>

<div class="summary-row">
  <div class="card red"><div class="num" id="cnt-overdue">0</div><div class="lbl">באיחור</div></div>
  <div class="card orange"><div class="num" id="cnt-soon">0</div><div class="lbl">השבוע</div></div>
  <div class="card green"><div class="num" id="cnt-ok">0</div><div class="lbl">תקין</div></div>
  <div class="card blue"><div class="num" id="cnt-total">0</div><div class="lbl">סה"כ תיקים</div></div>
</div>

<div class="table-section">
  <div class="table-wrap">
    <table id="main-table">
      <thead>
        <tr>
          <th>שם התיק</th>
          <th>פעולה הבאה</th>
          <th>מועד ביצוע</th>
          <th>דחיפות</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">
      <div class="empty-icon">📂</div>
      <p>אין תיקים עדיין — לחצי על <strong>+ הוסף תיק</strong> כדי להתחיל</p>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">הוספת תיק חדש</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="field"><label>שם התיק</label><input id="inp-name" type="text" placeholder="לדוגמה: כהן נ׳ לוי" /></div>
    <div class="field"><label>פעולה הבאה</label><input id="inp-action" type="text" placeholder="לדוגמה: הגשת כתב הגנה" /></div>
    <div class="field"><label>מועד ביצוע</label><input id="inp-date" type="date" /></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      <button class="btn-save" onclick="saveCase()">שמור</button>
    </div>
  </div>
</div>

<script>
  var cases = JSON.parse(localStorage.getItem('law-cases') || '[]');
  var editId = null;

  function render() {
    var tbody = document.getElementById('tbody');
    var empty = document.getElementById('empty');
    var sorted = cases.slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
    tbody.innerHTML = '';
    if (sorted.length === 0) {
      empty.style.display = 'block';
      document.getElementById('main-table').style.display = 'none';
    } else {
      empty.style.display = 'none';
      document.getElementById('main-table').style.display = '';
    }
    var over=0, soon=0, ok=0;
    sorted.forEach(function(c) {
      var days = daysLeft(c.date);
      if (days < 0) over++; else if (days <= 7) soon++; else ok++;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="case-name">' + esc(c.name) + '</td>' +
        '<td class="action-text">' + esc(c.action) + '</td>' +
        '<td class="date-text">' + fmtDate(c.date) + '</td>' +
        '<td>' + badge(days) + '</td>' +
        '<td><div class="row-actions">' +
          '<button class="btn-edit" onclick="openEdit(' + c.id + ')">עריכה</button>' +
          '<button class="btn-del"  onclick="del(' + c.id + ')">מחיקה</button>' +
        '</div></td>';
      tbody.appendChild(tr);
    });
    document.getElementById('cnt-overdue').textContent = over;
    document.getElementById('cnt-soon').textContent = soon;
    document.getElementById('cnt-ok').textContent = ok;
    document.getElementById('cnt-total').textContent = sorted.length;
  }

  function daysLeft(d) {
    var t = new Date(); t.setHours(0,0,0,0);
    var x = new Date(d); x.setHours(0,0,0,0);
    return Math.round((x-t)/86400000);
  }

  function badge(days) {
    if (days < 0)   return '<span class="badge overdue">⚠ איחור ' + Math.abs(days) + ' ימים</span>';
    if (days === 0) return '<span class="badge overdue">⚠ היום!</span>';
    if (days <= 7)  return '<span class="badge soon">⏰ ' + days + ' ימים</span>';
    return '<span class="badge ok">✓ ' + days + ' ימים</span>';
  }

  function fmtDate(s) {
    var d = new Date(s);
    return d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'});
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function openModal() {
    editId = null;
    document.getElementById('modal-title').textContent = 'הוספת תיק חדש';
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-action').value = '';
    document.getElementById('inp-date').value = '';
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('inp-name').focus();
  }

  function openEdit(id) {
    var c = cases.find(function(x){ return x.id===id; });
    if (!c) return;
    editId = id;
    document.getElementById('modal-title').textContent = 'עריכת תיק';
    document.getElementById('inp-name').value   = c.name;
    document.getElementById('inp-action').value = c.action;
    document.getElementById('inp-date').value   = c.date;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('inp-name').focus();
  }

  function closeModal() { document.getElementById('overlay').classList.add('hidden'); }

  function overlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  function saveCase() {
    var name   = document.getElementById('inp-name').value.trim();
    var action = document.getElementById('inp-action').value.trim();
    var date   = document.getElementById('inp-date').value;
    if (!name || !action || !date) { alert('נא למלא את כל השדות'); return; }
    if (editId !== null) {
      cases = cases.map(function(c){ return c.id===editId ? {id:c.id,name:name,action:action,date:date} : c; });
    } else {
      cases.push({id: Date.now(), name:name, action:action, date:date});
    }
    localStorage.setItem('law-cases', JSON.stringify(cases));
    closeModal();
    render();
  }

  function del(id) {
    var c = cases.find(function(x){ return x.id===id; });
    if (!c || !confirm('למחוק את התיק "' + c.name + '"?')) return;
    cases = cases.filter(function(x){ return x.id!==id; });
    localStorage.setItem('law-cases', JSON.stringify(cases));
    render();
  }

  render();
</script>
</body>
</html>
