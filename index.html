<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניהול תיקים</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6fb;
    color: #1e2a3a;
    min-height: 100vh;
    direction: rtl;
  }

  /* ── Header ── */
  .top-bar {
    background: linear-gradient(135deg, #1e2a3a 0%, #2d4263 100%);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .top-bar h1 { color: #fff; font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .btn-add {
    background: #c9a84c; color: #1e2a3a; border: none;
    padding: 10px 22px; border-radius: 8px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-add:hover { background: #e0bc66; }

  /* ── Summary cards ── */
  .summary-row {
    display: flex; gap: 14px;
    padding: 22px 40px 0;
    max-width: 1060px; margin: 0 auto;
  }
  .card {
    flex: 1; background: #fff; border-radius: 14px;
    padding: 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #e5e7eb;
    border-top: 4px solid transparent;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card-text { display: flex; flex-direction: column; gap: 4px; }
  .card .num { font-size: 2.2rem; font-weight: 800; line-height: 1; }
  .card .lbl { font-size: 12px; color: #6b7280; font-weight: 500; }
  .card-icon { padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card.red    { border-top-color: #e53e3e; } .card.red    .num { color: #e53e3e; }
  .card.orange { border-top-color: #d97706; } .card.orange .num { color: #d97706; }
  .card.green  { border-top-color: #059669; } .card.green  .num { color: #059669; }
  .card.blue   { border-top-color: #3b82f6; } .card.blue   .num { color: #3b82f6; }
  .card.red    .card-icon { background: rgba(220,38,38,0.08);   color: #dc2626; }
  .card.orange .card-icon { background: rgba(217,119,6,0.08);   color: #d97706; }
  .card.green  .card-icon { background: rgba(5,150,105,0.08);   color: #059669; }
  .card.blue   .card-icon { background: rgba(59,130,246,0.08);  color: #3b82f6; }
  .card.filterable { cursor: pointer; }
  .card.filterable:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.10); border-color: #c8d0dc; }
  .card.filterable.active { box-shadow: 0 0 0 3px currentColor; }
  .card.red.active    { box-shadow: 0 0 0 3px #e53e3e; }
  .card.orange.active { box-shadow: 0 0 0 3px #d97706; }
  .card.green.active  { box-shadow: 0 0 0 3px #059669; }
  .filter-notice { max-width: 1060px; margin: 10px auto 0; padding: 0 40px; }
  .filter-chip { display: inline-flex; align-items: center; gap: 8px; background: #1e2a3a; color: #fff; font-size: 12px; padding: 5px 12px; border-radius: 20px; }
  .filter-chip button { background: none; border: none; color: #c9a84c; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 0 0 4px; }

  /* ── Table ── */
  .search-wrap { max-width: 1060px; margin: 16px auto 0; padding: 0 40px; }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 6px 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .search-input-wrap { flex: 1; position: relative; display: flex; align-items: center; }
  .search-input-icon { position: absolute; right: 10px; color: #9ca3af; pointer-events: none; display: flex; }
  .search-input-wrap input {
    width: 100%; padding: 7px 38px 7px 10px;
    border: none; background: transparent; outline: none;
    font-size: 14px; font-family: inherit; direction: rtl; color: #1e2a3a;
  }
  .search-input-wrap input::placeholder { color: #9ca3af; }
  .search-btn {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    padding: 7px 14px; border: 1px solid #e5e7eb; border-radius: 9px;
    background: #fff; color: #374151; font-size: 13px; font-family: inherit;
    cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s;
  }
  .search-btn:hover { background: #f9fafb; border-color: #d1d5db; }
  .search-btn svg { color: #6b7280; }
  .table-section { max-width: 1060px; margin: 16px auto 48px; padding: 0 40px; }
  .table-wrap { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); overflow: hidden; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #1e2a3a; }
  thead th {
    color: #c9a84c; padding: 13px 18px;
    text-align: right; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; white-space: nowrap;
  }

  /* Case header row */
  tr.case-row { background: #eef1f9; }
  tr.case-row td { padding: 14px 18px; border-bottom: 1px solid #dde3f2; }
  .case-header-cell { display: flex; flex-direction: column; gap: 5px; }
  .case-title-row { display: flex; align-items: center; gap: 9px; }
  .case-icon { color: #4b6da8; font-size: 16px; flex-shrink: 0; }
  .case-name-link { cursor: pointer; font-size: 15px; font-weight: 700; color: #1e2a3a; }
  .case-name-link:hover { color: #2d4263; text-decoration: underline; }
  .case-meta-row { display: flex; align-items: center; flex-wrap: wrap; padding-right: 25px; row-gap: 3px; }
  .case-meta-item { font-size: 11.5px; color: #6b7280; white-space: nowrap; }
  .case-meta-sep { font-size: 10px; color: #d1d5db; padding: 0 6px; }
  .case-meta-proc { font-family: 'Courier New', monospace; font-size: 11px; color: #9ca3af; letter-spacing: 0.3px; }
  .case-header-block { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .case-header-side { display: flex; align-items: flex-start; gap: 16px; flex-shrink: 0; }
  .case-hearings-panel { min-width: 155px; }
  .case-row-actions { flex-shrink: 0; }

  /* Hearing display — v0 style */
  .hv-list { display: flex; flex-direction: column; }
  .hv-item { display: flex; align-items: flex-start; gap: 6px; padding: 5px 0; }
  .hv-item + .hv-item { border-top: 1px dashed #edf0f7; margin-top: 2px; }
  .hv-content { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
  .hv-date-time { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .hv-date { font-size: 13px; font-weight: 600; color: #1e2a3a; white-space: nowrap; }
  .hv-date.past-h  { color: #b0b8c8; }
  .hv-date.soon-h  { color: #b45309; }
  .hv-date.next-h  { color: #3b5bdb; }
  .hv-time { font-size: 11px; color: #9ca3af; }
  .hv-details { display: flex; flex-direction: column; gap: 1px; padding-top: 2px; }
  .hv-detail { font-size: 11px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .hv-edit-btns { display: flex; gap: 2px; flex-shrink: 0; }
  .hv-item.is-next { background: #f0f4ff; border-radius: 7px; padding: 5px 8px; margin: 0 -8px; }
  .hv-next-tag { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; background: #eff2ff; color: #3b5bdb; border: 1px solid #c7d2ff; margin-inline-start: 5px; vertical-align: middle; white-space: nowrap; }
  .no-hearing { color: #c8ccd6; font-size: 13px; }
  .section-label { display: block; font-size: 11px; font-weight: 700; color: #9ca3af; letter-spacing: 0.6px; padding: 14px 0 6px; border-bottom: 1px solid #f0f0f0; margin-bottom: 12px; }
  .field textarea { width: 100%; padding: 10px 13px; border: 1.5px solid #e5e7eb; border-radius: 9px; font-size: 14px; font-family: inherit; direction: rtl; outline: none; color: #1e2a3a; transition: border 0.15s; resize: vertical; min-height: 75px; }
  .field textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .modal { max-height: 90vh; overflow-y: auto; }

  /* Task rows — v0 card style */
  tr.task-row td, tr.task-other td { padding: 2px 14px; border: none; }
  tr.task-row, tr.task-other { background: transparent; border: none; }

  .task-card {
    display: flex; align-items: center;
    padding: 12px 16px; border-radius: 8px;
    transition: background 0.12s;
  }
  .task-card:hover { background: rgba(0,0,0,0.025); }
  .task-card-other { background: #f8f9fb; border-inline-end: 3px solid #cbd5e1; }
  .task-card-other:hover { background: #f1f4f8; }

  /* Title column */
  .tc-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .tc-title-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-title-link { font-weight: 500; font-size: 14px; color: #1e2a3a; cursor: pointer; line-height: 1.3; }
  .task-title-link:hover { text-decoration: underline; }
  .task-title-other { color: #94a3b8; font-style: italic; font-weight: 400; }
  .tc-assignee-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .tc-assignee-mine  { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .tc-assignee-other { background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; }
  .tc-attachments { display: flex; flex-direction: column; gap: 2px; }
  .tc-attachment { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #9ca3af; text-decoration: none; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-attachment:hover { color: #4b6da8; text-decoration: underline; }

  /* Date column */
  .tc-date { width: 110px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .tc-date-lbl { font-size: 10px; color: #c0c5cf; font-weight: 500; letter-spacing: 0.3px; }
  .tc-date-val { font-size: 12.5px; color: #6b7280; white-space: nowrap; }
  .tc-date-none { font-size: 12px; color: #d1d5db; }

  /* Badge column */
  .tc-badge-col { width: 150px; display: flex; justify-content: center; flex-shrink: 0; }
  .other-badge { font-size: 11px; color: #c4c9d4; font-style: italic; }

  /* Action buttons */
  .tc-actions { width: 130px; display: flex; justify-content: flex-end; gap: 6px; flex-shrink: 0; }
  .btn-task-edit, .btn-task-del {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 11px; border-radius: 7px;
    font-size: 12px; font-family: inherit; font-weight: 500;
    cursor: pointer; border: 1px solid; transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .btn-task-edit { background: #fff; color: #374151; border-color: #e5e7eb; }
  .btn-task-edit:hover { background: #f9fafb; border-color: #d1d5db; }
  .btn-task-del  { background: #fff; color: #dc2626; border-color: #fecaca; }
  .btn-task-del:hover  { background: #fef2f2; }
  .task-files-status { font-size: 12px; color: #059669; margin-bottom: 6px; line-height: 1.6; }
  .arrow { color: #b0b8cc; }
  .no-date { color: #c0c4cc; font-style: italic; font-size: 13px; }
  .date-val { color: #6b7280; font-size: 13px; white-space: nowrap; }

  /* Urgency badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .badge.over { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .badge.soon { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
  .badge.ok   { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
  .badge.none { color: #d1d5db; }
  .owner-toggle { display: flex; border: 1.5px solid #e5e7eb; border-radius: 9px; overflow: hidden; margin-top: 2px; }
  .owner-toggle input[type=radio] { display: none; }
  .owner-toggle label { flex: 1; text-align: center; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: #6b7280; background: #fff; transition: all 0.15s; }
  .owner-toggle input[type=radio]:checked + label { background: #1e2a3a; color: #fff; }
  .tag-mine  { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; white-space: nowrap; margin-right: 6px; }
  .tag-other { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; white-space: nowrap; margin-right: 6px; }

  /* Add-task row */
  tr.add-row td {
    padding: 7px 18px 7px 46px;
    background: #f7f9ff;
    border-bottom: 2px solid #e4e9f7;
  }
  .btn-add-task {
    background: none; border: 1px dashed #97aad4;
    color: #4b6da8; padding: 4px 14px; border-radius: 6px;
    font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .btn-add-task:hover { background: #eef1fb; border-color: #4b6da8; }

  /* Spacer between cases */
  tr.spacer td { height: 10px; background: #f4f6fb; padding: 0; }

  /* Action buttons */
  .btns { display: flex; gap: 6px; flex-wrap: nowrap; }
  .btn-sm {
    border: none; border-radius: 6px; padding: 5px 11px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: opacity 0.12s; white-space: nowrap;
  }
  .btn-sm:hover { opacity: 0.72; }
  .be { background: #eff6ff; color: #1d4ed8; }
  .bd { background: #fef2f2; color: #dc2626; }
  .te { background: #f0fdf4; color: #166534; }
  .td { background: #fef2f2; color: #dc2626; }
  .hearing-edit-btn { background: none; border: none; cursor: pointer; font-size: 17px; color: #9ca3af; padding: 4px 6px; border-radius: 6px; line-height: 1; flex-shrink: 0; }
  .hearing-edit-btn:hover { color: #6d28d9; background: #f5f0ff; }
  .hearing-del-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: #d1d5db; padding: 4px 5px; border-radius: 6px; line-height: 1; flex-shrink: 0; }
  .hearing-del-btn:hover { color: #dc2626; background: #fef2f2; }
  .btn-add-hearing { display: inline-block; margin-top: 6px; background: none; border: 1px dashed #97aad4; color: #4b6da8; padding: 2px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
  .btn-add-hearing:hover { background: #eef1fb; border-color: #4b6da8; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: #9ca3af; }
  .empty .ei { font-size: 42px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,20,40,0.52);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #fff; border-radius: 16px; padding: 32px 30px 26px;
    width: 460px; max-width: 95vw;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    animation: up 0.17s ease;
  }
  @keyframes up { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .mhdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .mhdr h2 { font-size: 18px; color: #1e2a3a; font-weight: 700; }
  .btn-x { background: none; border: none; font-size: 19px; color: #9ca3af; cursor: pointer; line-height: 1; }
  .btn-x:hover { color: #374151; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 5px; }
  .opt { font-size: 11px; color: #aaa; font-weight: 400; margin-right: 4px; }
  .field input {
    width: 100%; padding: 10px 13px;
    border: 1.5px solid #e5e7eb; border-radius: 9px;
    font-size: 14px; font-family: inherit; direction: rtl;
    outline: none; color: #1e2a3a; transition: border 0.15s;
  }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .mftr { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .btn-save {
    background: #1e2a3a; color: #c9a84c; border: none;
    padding: 10px 26px; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-save:hover { background: #2d4263; }
  .btn-cancel {
    background: #f3f4f6; color: #374151; border: none;
    padding: 10px 18px; border-radius: 9px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .btn-cancel:hover { background: #e5e7eb; }

  @media (max-width: 680px) {
    .top-bar, .summary-row, .search-wrap, .table-section { padding-right: 14px; padding-left: 14px; }
    .search-btn span { display: none; }
    .summary-row { flex-wrap: wrap; }
    .card { min-width: calc(50% - 7px); padding: 16px; }
    .card .num { font-size: 1.8rem; }
    thead th:nth-child(2), tbody td:nth-child(2),
    thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>⚖️ ניהול תיקים</h1>
  <button class="btn-add" onclick="openAddCase()">+ הוסף תיק</button>
</div>

<div class="summary-row">
  <div class="card red    filterable" id="card-overdue" onclick="filterCard('overdue')">
    <div class="card-text"><div class="num" id="cnt-over">0</div><div class="lbl">משימות באיחור</div></div>
    <div class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
  </div>
  <div class="card orange filterable" id="card-week"    onclick="filterCard('week')">
    <div class="card-text"><div class="num" id="cnt-soon">0</div><div class="lbl">משימות השבוע</div></div>
    <div class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
  </div>
  <div class="card green  filterable" id="card-today"   onclick="filterCard('today')">
    <div class="card-text"><div class="num" id="cnt-ok">0</div><div class="lbl">משימות להיום</div></div>
    <div class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div>
  </div>
  <div class="card blue">
    <div class="card-text"><div class="num" id="cnt-cases">0</div><div class="lbl">תיקים פתוחים</div></div>
    <div class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
  </div>
</div>
<div class="filter-notice" id="filter-notice" style="display:none">
  <span class="filter-chip" id="filter-chip-text"></span>
</div>

<div class="search-wrap">
  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="search-input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <input id="search-input" type="text" placeholder="חיפוש לפי שם תיק, משימה או שם לקוח..." oninput="onSearch()" />
    </div>
    <button class="search-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>סינון</button>

<script>
// ── Data ──────────────────────────────────────────────────────────
var STORE = 'law-cases-v3';
var cases = loadData();
var mode = null, mCaseId = null, mTaskId = null, mHearingId = null;
var searchQuery = '';
function onSearch() {
  searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
  render();
}
var cardFilter = null;
function filterCard(type) {
  cardFilter = cardFilter === type ? null : type;
  render();
}
function taskMatchesFilter(t, filter) {
  if (!filter || t.owner === 'הצד השני' || !t.date) return filter === null;
  var days = daysLeft(t.date);
  if (filter === 'overdue') return days < 0;
  if (filter === 'week')    return days >= 0 && days <= 7;
  if (filter === 'today')   return days === 0;
  return false;
}
var pendingFeeFile = null; // {name, data} = new file; null = keep existing
var pendingTaskFiles = null; // array of {name,data} = new files; null = keep existing

function onFeeFileChange(e) {
  var file = e.target.files[0];
  if (!file) { pendingFeeFile = null; return; }
  var reader = new FileReader();
  reader.onload = function(ev) { pendingFeeFile = { name: file.name, data: ev.target.result }; };
  reader.readAsDataURL(file);
}
function onTaskFilesChange(e) {
  var files = Array.from(e.target.files);
  if (!files.length) { pendingTaskFiles = null; return; }
  pendingTaskFiles = new Array(files.length);
  files.forEach(function(file, i) {
    var reader = new FileReader();
    reader.onload = function(ev) { pendingTaskFiles[i] = { name: file.name, data: ev.target.result }; };
    reader.readAsDataURL(file);
  });
}

function emptyHearing() {
  return { date: null, time: null, court: null, judge: null, materials: null };
}

function toHearingsArray(c) {
  if (c.hearings) return c;
  var h = c.hearing || emptyHearing();
  var hearings = h.date ? [Object.assign({ id: uid() }, h)] : [];
  var nc = Object.assign({}, c, { hearings: hearings });
  delete nc.hearing;
  return nc;
}
function loadData() {
  var raw = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (raw) {
    var migrated = raw.map(toHearingsArray);
    localStorage.setItem(STORE, JSON.stringify(migrated));
    return migrated;
  }
  // Migrate v2 format (hearingDate field)
  var v2 = JSON.parse(localStorage.getItem('law-cases-v2') || 'null');
  if (v2) {
    var m2 = v2.map(function(c) {
      var h = emptyHearing(); h.date = c.hearingDate || null;
      return toHearingsArray({ id: c.id, name: c.name, hearing: h, tasks: c.tasks || [] });
    });
    localStorage.setItem(STORE, JSON.stringify(m2));
    return m2;
  }
  // Migrate v1 format (flat .action)
  var v1 = JSON.parse(localStorage.getItem('law-cases') || '[]');
  if (v1.length && v1[0].action !== undefined) {
    var m1 = v1.map(function(c) {
      var tasks = [];
      if (c.action) tasks.push({ id: uid(), action: c.action, date: c.date || null });
      return toHearingsArray({ id: c.id, name: c.name, hearing: emptyHearing(), tasks: tasks });
    });
    localStorage.setItem(STORE, JSON.stringify(m1));
    return m1;
  }
  return [];
}

function persist() { localStorage.setItem(STORE, JSON.stringify(cases)); }

function uid() { return Date.now() + Math.floor(Math.random() * 9999); }

// ── Render ────────────────────────────────────────────────────────
function render() {
  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('tbl');
  var sorted = sortCases(cases);
  if (searchQuery) {
    sorted = sorted.filter(function(c) {
      if ((c.name || '').toLowerCase().indexOf(searchQuery) >= 0) return true;
      if ((c.clientName || '').toLowerCase().indexOf(searchQuery) >= 0) return true;
      return c.tasks.some(function(t) { return (t.action || '').toLowerCase().indexOf(searchQuery) >= 0; });
    });
  }
  var cardTaskMap = null;
  if (cardFilter) {
    cardTaskMap = {};
    sorted = sorted.filter(function(c) {
      var matching = c.tasks.filter(function(t) { return taskMatchesFilter(t, cardFilter); });
      if (!matching.length) return false;
      cardTaskMap[c.id] = matching;
      return true;
    });
  }
  // Update active card UI
  ['overdue','week','today'].forEach(function(f) {
    var el = document.getElementById('card-' + f);
    if (el) el.classList.toggle('active', cardFilter === f);
  });
  var noticeEl = document.getElementById('filter-notice');
  var chipEl   = document.getElementById('filter-chip-text');
  if (cardFilter) {
    var labels = { overdue: 'משימות באיחור', week: 'משימות השבוע', today: 'משימות להיום' };
    chipEl.innerHTML = 'מציג: ' + labels[cardFilter] + ' <button onclick="filterCard(\'' + cardFilter + '\')">✕</button>';
    noticeEl.style.display = '';
  } else {
    noticeEl.style.display = 'none';
  }

  document.getElementById('empty').style.display = sorted.length ? 'none' : 'block';
  document.getElementById('tbl').style.display   = sorted.length ? ''     : 'none';

  tbody.innerHTML = '';
  var over = 0, soon = 0, todayCnt = 0;

  sorted.forEach(function(c, ci) {
    // Spacer between cases
    if (ci > 0) {
      var sp = document.createElement('tr');
      sp.className = 'spacer';
      sp.innerHTML = '<td colspan="5"></td>';
      tbody.appendChild(sp);
    }

    // ── Case header row
    var cr = document.createElement('tr');
    cr.className = 'case-row';
    var metaParts = [];
    if (c.procNum)       metaParts.push('<span class="case-meta-item case-meta-proc">#\u202f' + x(c.procNum) + '</span>');
    if (c.clientName)    metaParts.push('<span class="case-meta-item">' + x(c.clientName) + '</span>');
    if (c.caseCourtName) metaParts.push('<span class="case-meta-item">' + x(c.caseCourtName) + '</span>');
    if (c.handler)       metaParts.push('<span class="case-meta-item">' + x(c.handler) + '</span>');
    var metaHtml = metaParts.length
      ? '<div class="case-meta-row">' + metaParts.join('<span class="case-meta-sep">·</span>') + '</div>'
      : '';
    cr.innerHTML =
      '<td colspan="5"><div class="case-header-block">' +
        '<div class="case-header-cell">' +
          '<div class="case-title-row">' +
            '<span class="case-icon">⚖</span>' +
            '<span class="case-name-link" onclick="openEditCase(' + c.id + ')">' + x(c.name) + '</span>' +
            (c.feeFile ? '<a class="fee-link" href="' + c.feeFile.data + '" download="' + x(c.feeFile.name) + '" title="הסכם שכ&quot;ט: ' + x(c.feeFile.name) + '">📎</a>' : '') +
          '</div>' +
          metaHtml +
        '</div>' +
        '<div class="case-header-side">' +
          '<div class="case-hearings-panel">' + renderHearings(c.hearings, c.id) + '</div>' +
          '<div class="case-row-actions"><div class="btns"><button class="btn-sm bd" onclick="delCase(' + c.id + ')">מחק</button></div></div>' +
        '</div>' +
      '</div></td>';
    tbody.appendChild(cr);

    // ── Task rows
    var taskList = cardTaskMap ? (cardTaskMap[c.id] || []) : c.tasks;
    sortTasks(taskList).forEach(function(t) {
      var days = t.date ? daysLeft(t.date) : null;
      var isOther = t.owner === 'הצד השני';
      if (days !== null && !isOther) {
        if (days < 0) over++;
        else if (days <= 7) soon++;
        if (days === 0) todayCnt++;
      }
      var tr = document.createElement('tr');
      tr.className = isOther ? 'task-row task-other' : 'task-row';
      var openEdit = 'openEditTask(' + c.id + ',' + t.id + ')';
      var titleCls = 'task-title-link' + (isOther ? ' task-title-other' : '');
      var attachHtml = (t.files && t.files.length)
        ? '<div class="tc-attachments">' + t.files.map(function(f){
            return '<a class="tc-attachment" href="' + f.data + '" download="' + x(f.name) + '" title="' + x(f.name) + '">' +
              '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>' +
              x(f.name) + '</a>';
          }).join('') + '</div>' : '';
      var assigneeBadge = isOther
        ? '<span class="tc-assignee-badge tc-assignee-other">הצד השני</span>'
        : '<span class="tc-assignee-badge tc-assignee-mine">שלי</span>';
      var dateHtml = t.date
        ? '<span class="tc-date-lbl">מועד</span><span class="tc-date-val">' + fmt(t.date) + '</span>'
        : '<span class="tc-date-none">—</span>';
      var badgeCol = isOther
        ? '<span class="other-badge">מעקב בלבד</span>'
        : (days !== null ? badgeHtml(days) : '<span class="badge none">—</span>');
      var icoEdit  = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
      var icoTrash = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      var cardCls = 'task-card' + (isOther ? ' task-card-other' : '');
      tr.innerHTML = '<td colspan="5"><div class="' + cardCls + '">' +
        '<div class="tc-title">' +
          '<div class="tc-title-main"><span class="' + titleCls + '" onclick="' + openEdit + '">' + x(t.action) + '</span>' + assigneeBadge + '</div>' +
          attachHtml +
        '</div>' +
        '<div class="tc-date">' + dateHtml + '</div>' +
        '<div class="tc-badge-col">' + badgeCol + '</div>' +
        '<div class="tc-actions">' +
          '<button class="btn-task-edit" onclick="' + openEdit + '">' + icoEdit  + 'ערוך</button>' +
          '<button class="btn-task-del"  onclick="delTask(' + c.id + ',' + t.id + ')">' + icoTrash + 'מחק</button>' +
        '</div>' +
      '</div></td>';
      tbody.appendChild(tr);
    });

    // ── Add task row
    var ar = document.createElement('tr');
    ar.className = 'add-row';
    ar.innerHTML = '<td colspan="5"><button class="btn-add-task" onclick="openAddTask(' + c.id + ')">+ הוסף משימה לתיק ' + x(c.name) + '</button></td>';
    tbody.appendChild(ar);
  });

  document.getElementById('cnt-over').textContent  = over;
  document.getElementById('cnt-soon').textContent  = soon;
  document.getElementById('cnt-ok').textContent    = todayCnt;
  document.getElementById('cnt-cases').textContent = cases.length;
}

// ── Sorting ───────────────────────────────────────────────────────
function sortCases(arr) {
  return arr.slice().sort(function(a, b) { return score(a) - score(b); });
}
function score(c) {
  var dated = c.tasks.filter(function(t){ return t.date; });
  if (!dated.length) return Infinity;
  return Math.min.apply(null, dated.map(function(t){ return new Date(t.date).getTime(); }));
}

function sortTasks(tasks) {
  return tasks.slice().sort(function(a, b) {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });
}

// ── Helpers ───────────────────────────────────────────────────────
function daysLeft(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var v = new Date(d); v.setHours(0,0,0,0);
  return Math.round((v - t) / 86400000);
}
function badgeHtml(days) {
  if (days < 0)   return '<span class="badge over">⚠ איחור ' + Math.abs(days) + ' ימים</span>';
  if (days === 0) return '<span class="badge over">⚠ היום!</span>';
  if (days <= 7)  return '<span class="badge soon">⏰ ' + days + ' ימים</span>';
  return '<span class="badge ok">✓ ' + days + ' ימים</span>';
}
function hearingCls(d) {
  var days = daysLeft(d);
  if (days < 0) return 'over-h';
  if (days <= 14) return 'soon-h';
  return '';
}
function renderOneHearing(h, colorCls, isNext) {
  if (!h || !h.date) return '';
  var html = '<div class="hv-date-time">' +
    '<span class="hv-date' + (colorCls ? ' ' + colorCls : '') + '">' + fmt(h.date) +
    (isNext ? '<span class="hv-next-tag">הבא</span>' : '') + '</span>' +
    (h.time ? '<span class="hv-time">' + h.time + '</span>' : '') +
  '</div>';
  if (h.court || h.judge) {
    html += '<div class="hv-details">';
    if (h.court) html += '<span class="hv-detail">' + x(h.court) + '</span>';
    if (h.judge) html += '<span class="hv-detail">' + x(h.judge) + '</span>';
    html += '</div>';
  }
  return html;
}
function renderHearings(hearings, cid) {
  var list = (hearings || []).slice().sort(function(a, b) {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1; if (!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });
  var nextId = null;
  for (var i = 0; i < list.length; i++) {
    if (list[i].date && daysLeft(list[i].date) >= 0) { nextId = list[i].id; break; }
  }
  if (!list.length) {
    return '<span class="no-hearing">—</span>' +
      '<div><button class="btn-add-hearing" onclick="openAddHearing(' + cid + ')">+ דיון</button></div>';
  }
  var blocks = list.map(function(h) {
    var d = h.date ? daysLeft(h.date) : null;
    var isNext = h.id === nextId;
    var colorCls = isNext ? 'next-h' : d !== null && d < 0 ? 'past-h' : d !== null && d <= 14 ? 'soon-h' : '';
    var itemCls = 'hv-item' + (isNext ? ' is-next' : '');
    return '<div class="' + itemCls + '">' +
      '<div class="hv-content">' + renderOneHearing(h, colorCls, isNext) + '</div>' +
      '<div class="hv-edit-btns">' +
        '<button class="hearing-edit-btn" onclick="openEditHearing(' + cid + ',' + h.id + ')" title="עריכה">✏</button>' +
        '<button class="hearing-del-btn"  onclick="delHearing(' + cid + ',' + h.id + ')"  title="מחיקה">×</button>' +
      '</div>' +
    '</div>';
  });
  return '<div class="hv-list">' + blocks.join('') + '</div>' +
    '<div><button class="btn-add-hearing" onclick="openAddHearing(' + cid + ')">+ דיון</button></div>';
}
function fmt(s) {
  return new Date(s).toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function x(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Modal helpers ─────────────────────────────────────────────────
var ALL_FIELDS = ['f-name','f-handler','f-proc-num','f-client-name','f-client-phone','f-client-email','f-case-court','f-case-judge','f-fee-file','f-notes','f-hearing-section','f-hearing','f-time','f-court','f-judge','f-materials','f-owner','f-action','f-date','f-task-files'];
function show(ids) {
  ALL_FIELDS.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = ids.indexOf(id) >= 0 ? '' : 'none';
  });
}
function openAddCase() {
  mode = 'add-case';
  document.getElementById('m-title').textContent = 'הוספת תיק חדש';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-hearing').value = '';
  document.getElementById('inp-time-h').value = '';
  document.getElementById('inp-time-m').value = '00';
  document.getElementById('inp-court').value = '';
  document.getElementById('inp-judge').value = '';
  document.getElementById('inp-materials').value = '';
  show(['f-name','f-hearing-section','f-hearing','f-time','f-court','f-judge','f-materials']);
  showModal(); document.getElementById('inp-name').focus();
}
function openEditCase(cid) {
  var c = cases.find(function(v){ return v.id===cid; }); if (!c) return;
  mode = 'edit-case'; mCaseId = cid;
  document.getElementById('m-title').textContent = 'עריכת תיק';
  document.getElementById('inp-name').value = c.name;
  document.getElementById('inp-handler').value      = c.handler      || '';
  document.getElementById('inp-proc-num').value    = c.procNum     || '';
  document.getElementById('inp-client-name').value  = c.clientName  || '';
  document.getElementById('inp-client-phone').value = c.clientPhone || '';
  document.getElementById('inp-client-email').value  = c.clientEmail  || '';
  document.getElementById('inp-case-court').value    = c.caseCourtName || '';
  document.getElementById('inp-case-judge').value    = c.caseJudge    || '';
  pendingFeeFile = null;
  document.getElementById('inp-fee-file').value = '';
  document.getElementById('fee-file-status').innerHTML = c.feeFile ? '📎 ' + x(c.feeFile.name) + ' (קיים)' : '';
  document.getElementById('inp-notes').value = c.notes || '';
  show(['f-name','f-handler','f-proc-num','f-client-name','f-client-phone','f-client-email','f-case-court','f-case-judge','f-fee-file','f-notes']);
  showModal(); document.getElementById('inp-name').focus();
}
function openAddHearing(cid) {
  var c = cases.find(function(v){ return v.id===cid; }); if (!c) return;
  mode = 'add-hearing'; mCaseId = cid; mHearingId = null;
  document.getElementById('m-title').textContent = 'דיון חדש — ' + c.name;
  document.getElementById('inp-hearing').value = '';
  document.getElementById('inp-time-h').value = '';
  document.getElementById('inp-time-m').value = '00';
  document.getElementById('inp-court').value = '';
  document.getElementById('inp-judge').value = '';
  document.getElementById('inp-materials').value = '';
  show(['f-hearing-section','f-hearing','f-time','f-court','f-judge','f-materials']);
  showModal(); document.getElementById('inp-hearing').focus();
}
function openEditHearing(cid, hid) {
  var c = cases.find(function(v){ return v.id===cid; }); if (!c) return;
  var h = (c.hearings || []).find(function(v){ return v.id===hid; }) || emptyHearing();
  mode = 'edit-hearing'; mCaseId = cid; mHearingId = hid;
  document.getElementById('m-title').textContent = 'עריכת דיון — ' + c.name;
  document.getElementById('inp-hearing').value   = h.date || '';
  var tp = h.time ? h.time.split(':') : ['','00'];
  document.getElementById('inp-time-h').value = tp[0] || '';
  document.getElementById('inp-time-m').value = tp[1] || '00';
  document.getElementById('inp-court').value     = h.court || '';
  document.getElementById('inp-judge').value     = h.judge || '';
  document.getElementById('inp-materials').value = h.materials || '';
  show(['f-hearing-section','f-hearing','f-time','f-court','f-judge','f-materials']);
  showModal(); document.getElementById('inp-hearing').focus();
}
function openAddTask(cid) {
  var c = cases.find(function(v){ return v.id===cid; }); if (!c) return;
  mode = 'add-task'; mCaseId = cid;
  document.getElementById('m-title').textContent = 'משימה חדשה — ' + c.name;
  document.getElementById('owner-mine').checked = true;
  document.getElementById('inp-action').value = '';
  document.getElementById('inp-date').value   = '';
  pendingTaskFiles = [];
  document.getElementById('inp-task-files').value = '';
  document.getElementById('task-files-status').innerHTML = '';
  show(['f-owner','f-action','f-date','f-task-files']);
  showModal(); document.getElementById('inp-action').focus();
}
function openEditTask(cid, tid) {
  var c = cases.find(function(v){ return v.id===cid; }); if (!c) return;
  var t = c.tasks.find(function(v){ return v.id===tid; }); if (!t) return;
  mode = 'edit-task'; mCaseId = cid; mTaskId = tid;
  document.getElementById('m-title').textContent = 'עריכת משימה';
  var ownerVal = t.owner || 'שלי';
  document.querySelector('input[name="task-owner"][value="' + ownerVal + '"]').checked = true;
  document.getElementById('inp-action').value = t.action;
  document.getElementById('inp-date').value   = t.date || '';
  pendingTaskFiles = null;
  document.getElementById('inp-task-files').value = '';
  var existing = t.files && t.files.length;
  document.getElementById('task-files-status').innerHTML = existing
    ? t.files.map(function(f){ return '📎 ' + x(f.name); }).join('<br>') + (existing ? '<br><span style="color:#aaa;font-size:11px">בחירת קבצים חדשים תחליף את הקיימים</span>' : '')
    : '';
  show(['f-owner','f-action','f-date','f-task-files']);
  showModal(); document.getElementById('inp-action').focus();
}
function showModal()  { document.getElementById('overlay').classList.remove('hidden'); }
function closeModal() { document.getElementById('overlay').classList.add('hidden'); }
function bgClick(e)   { if (e.target===document.getElementById('overlay')) closeModal(); }

// ── Save ──────────────────────────────────────────────────────────
function saveModal() {
  if (mode === 'add-case')     { addCase();      }
  if (mode === 'edit-case')    { editCase();     }
  if (mode === 'edit-hearing') { editHearing();  }
  if (mode === 'add-hearing')  { addHearing();   }
  if (mode === 'add-task')     { addTask();      }
  if (mode === 'edit-task')    { editTask();     }
}
function readHearingFromModal() {
  return {
    date:      document.getElementById('inp-hearing').value   || null,
    time:      document.getElementById('inp-time-h').value ? (document.getElementById('inp-time-h').value + ':' + document.getElementById('inp-time-m').value) : null,
    court:     document.getElementById('inp-court').value.trim()     || null,
    judge:     document.getElementById('inp-judge').value.trim()     || null,
    materials: document.getElementById('inp-materials').value.trim() || null
  };
}
function addCase() {
  var name = document.getElementById('inp-name').value.trim();
  if (!name) { alert('נא להזין שם תיק'); return; }
  var h = readHearingFromModal();
  var hearings = h.date ? [Object.assign({ id: uid() }, h)] : [];
  cases.push({ id: uid(), name: name, hearings: hearings, tasks: [] });
  persist(); closeModal(); render();
}
function editCase() {
  var name = document.getElementById('inp-name').value.trim();
  if (!name) { alert('נא להזין שם תיק'); return; }
  cases = cases.map(function(c) {
    if (c.id !== mCaseId) return c;
    return Object.assign({}, c, {
      name:        name,
      handler:     document.getElementById('inp-handler').value.trim()      || null,
      procNum:     document.getElementById('inp-proc-num').value.trim()    || null,
      clientName:  document.getElementById('inp-client-name').value.trim() || null,
      clientPhone: document.getElementById('inp-client-phone').value.trim()|| null,
      clientEmail:   document.getElementById('inp-client-email').value.trim()  || null,
      caseCourtName: document.getElementById('inp-case-court').value.trim()    || null,
      caseJudge:     document.getElementById('inp-case-judge').value.trim()    || null,
      feeFile:       pendingFeeFile !== null ? pendingFeeFile : (c.feeFile || null),
      notes:         document.getElementById('inp-notes').value.trim() || null
    });
  });
  persist(); closeModal(); render();
}
function editHearing() {
  var updated = Object.assign({ id: mHearingId }, readHearingFromModal());
  cases = cases.map(function(c) {
    if (c.id !== mCaseId) return c;
    return Object.assign({}, c, { hearings: c.hearings.map(function(h) { return h.id === mHearingId ? updated : h; }) });
  });
  persist(); closeModal(); render();
}
function addHearing() {
  var h = Object.assign({ id: uid() }, readHearingFromModal());
  cases = cases.map(function(c) {
    if (c.id !== mCaseId) return c;
    return Object.assign({}, c, { hearings: (c.hearings || []).concat([h]) });
  });
  persist(); closeModal(); render();
}
function delHearing(cid, hid) {
  if (!confirm('למחוק את הדיון?')) return;
  cases = cases.map(function(c) {
    if (c.id !== cid) return c;
    return Object.assign({}, c, { hearings: c.hearings.filter(function(h) { return h.id !== hid; }) });
  });
  persist(); render();
}
function addTask() {
  var action = document.getElementById('inp-action').value.trim();
  if (!action) { alert('נא להזין פעולה'); return; }
  var owner = document.querySelector('input[name="task-owner"]:checked').value;
  cases = cases.map(function(c) {
    if (c.id!==mCaseId) return c;
    var files = pendingTaskFiles ? pendingTaskFiles.filter(Boolean) : [];
    return Object.assign({},c,{tasks: c.tasks.concat([{id:uid(), action:action, date:document.getElementById('inp-date').value||null, owner:owner, files:files}])});
  });
  persist(); closeModal(); render();
}
function editTask() {
  var action = document.getElementById('inp-action').value.trim();
  if (!action) { alert('נא להזין פעולה'); return; }
  cases = cases.map(function(c) {
    if (c.id!==mCaseId) return c;
  var owner = document.querySelector('input[name="task-owner"]:checked').value;
    return Object.assign({},c,{tasks:c.tasks.map(function(t){
      var files = pendingTaskFiles !== null ? pendingTaskFiles.filter(Boolean) : (t.files || []);
      return t.id===mTaskId ? {id:t.id, action:action, date:document.getElementById('inp-date').value||null, owner:owner, files:files} : t;
    })});
  });
  persist(); closeModal(); render();
}
function delCase(cid) {
  var c = cases.find(function(v){ return v.id===cid; });
  if (!c||!confirm('למחוק את התיק "'+c.name+'" וכל המשימות?')) return;
  cases = cases.filter(function(v){ return v.id!==cid; });
  persist(); render();
}
function delTask(cid,tid) {
  if (!confirm('למחוק את המשימה?')) return;
  cases = cases.map(function(c) {
    return c.id!==cid ? c : Object.assign({},c,{tasks:c.tasks.filter(function(t){return t.id!==tid;})});
  });
  persist(); render();
}

render();
</script>
</body>
